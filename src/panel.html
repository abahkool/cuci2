<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' media: data: blob:; media-src 'self' media: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>CUCI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="panel-shell" data-panel="">
    <header class="panel-head">
      <button id="btnDock" class="pane-btn dock-btn" title="Dock this pane back into the main window" aria-label="Dock back into the main window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12H5" />
          <path d="M10 6l-6 6 6 6" />
          <path d="M20 4v16" />
        </svg>
      </button>
      <img class="panel-logo" src="logo.png" alt="" aria-hidden="true" />
      <span class="panel-title" id="panelTitle">CUCI</span>
      <span class="panel-sub" id="panelSub"></span>
      <span class="spacer"></span>
      <span class="panel-status" id="panelStatus"></span>
    </header>

    <!-- ───────────── side panel (media / deletes / subtitles) ───────────── -->
    <div id="panelSidebar" class="panel-body" hidden>
      <section class="panel quick-actions">
        <h3 data-i18n="actions">Actions</h3>
        <div class="action-grid">
          <button id="btnJob" class="btn tiny" data-i18n="job">Job</button>
          <button id="btnNsfw" class="btn tiny" data-i18n="parentAssist">Parent Assist</button>
          <button id="btnSidebarAddSub" class="btn tiny" data-i18n="addSubtitle">Add Subtitle</button>
          <button id="btnSidebarAddVideo" class="btn tiny" data-i18n="addVideo">Add Video</button>
        </div>
      </section>

      <section class="panel">
        <h3><span data-i18n="media">Media</span> <span id="clipCount" class="pill">0</span></h3>
        <div id="clipList" class="clip-list"></div>
      </section>

      <section class="panel">
        <h3><span data-i18n="deletes">Deletions</span> <span id="deleteCount" class="pill">0</span></h3>
        <div id="deleteList" class="delete-list"></div>
      </section>

      <section class="panel grow">
        <h3 data-i18n="subtitles">Subtitles</h3>
        <div class="row">
          <button id="btnSubAdd" class="btn tiny" data-i18n="addSubFiles">Add subtitle files…</button>
        </div>
        <div id="subInfo" class="sub-info">No subtitle loaded.</div>
        <div id="subTrackList" class="sub-track-list"></div>
        <div class="row">
          <label class="field"><span data-i18n="globalOffset">Global offset (ms)</span><input id="subOffset" type="number" step="10" value="0" /></label>
        </div>
        <div class="row">
          <button id="btnSubExport" class="btn tiny" data-i18n="exportSrt">Export synced .srt files…</button>
        </div>
        <div class="sub-events-head">
          <button id="btnToggleSubEvents" class="sub-events-toggle" aria-expanded="false" aria-controls="subEventList"
                  data-i18n-title="expand" title="Expand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
            <span data-i18n="subEvents">Subtitle text</span>
          </button>
          <span id="subEventCount" class="pill">0</span>
        </div>
        <div id="subEventList" class="sub-event-list hidden"></div>
      </section>
    </div>

    <!-- ───────────── control center (transport + delete tools) ───────────── -->
    <div id="panelTransport" class="panel-body transport-panel" hidden>
      <section class="transport">
        <div class="transport-row transport-main">
          <div class="transport-left">
            <button id="btnStop" class="btn icon" title="Stop" data-i18n-title="stop">■</button>
            <button id="btnPrevSec" class="btn icon" title="Back 1s" data-i18n-title="back1s">«</button>
            <button id="btnPrevFrame" class="btn icon" title="Previous frame (←)" data-i18n-title="prevFrame">‹</button>
            <button id="btnPlay" class="btn icon play" title="Play / pause (Space)" data-i18n-title="playPause">▶</button>
            <button id="btnNextFrame" class="btn icon" title="Next frame (→)" data-i18n-title="nextFrame">›</button>
            <button id="btnNextSec" class="btn icon" title="Forward 1s" data-i18n-title="forward1s">»</button>
          </div>
          <div class="timecodes">
            <span id="timecode" class="tc">0:00.000</span>
            <span class="tc-sep">/</span>
            <span id="timeTotal" class="tc muted">0:00.000</span>
            <span id="resultTc" class="tc result hidden"></span>
          </div>
          <div class="seek-wrap">
            <input id="seekRange" class="seek" type="range" min="0" max="10000" step="1" value="0" aria-label="Seek" data-i18n-aria="seek" />
          </div>
          <div class="transport-right">
            <div class="seg-toggle">
              <button id="modeSource" class="seg active" title="Preview the untouched source" data-i18n-title="sourceTitle" data-i18n="source">Source</button>
              <button id="modeResult" class="seg" title="Preview the delete result" data-i18n-title="previewTitle" data-i18n="preview">Preview</button>
            </div>
            <label class="snap" title="Snap edits to whole frames" data-i18n-title="snapTitle"><input id="chkSnap" type="checkbox" checked /> <span data-i18n="snap">Snap frame</span></label>
            <label class="zoom"><span data-i18n="zoom">Zoom</span><input id="zoomRange" type="range" min="1" max="12" step="0.1" value="1" /></label>
          </div>
        </div>

        <div class="transport-row transport-deletes">
          <span class="delete-toolbar-label" data-i18n="deleteTools">Deletions</span>

          <button id="btnSetIn" class="btn tiny glyph" title="Set In point at the playhead (I)" aria-label="Set In point" data-i18n-title="setIn" data-i18n-aria="setIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 4v16M9 4h4M9 20h4" />
            </svg>
          </button>
          <button id="btnSetOut" class="btn tiny glyph" title="Set Out point at the playhead (O)" aria-label="Set Out point" data-i18n-title="setOut" data-i18n-aria="setOut">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 4v16M15 4h-4M15 20h-4" />
            </svg>
          </button>
          <button id="btnDelete" class="btn tiny glyph danger" title="Delete the selected range / In→Out (X)" aria-label="Delete" data-i18n-title="delete" data-i18n-aria="delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="2.2" />
              <circle cx="6" cy="18" r="2.2" />
              <path d="M7.9 7.4 20 18" />
              <path d="M7.9 16.6 20 6" />
            </svg>
          </button>

          <span class="delete-toolbar-sep"></span>

          <button id="btnClearMarks" class="btn tiny glyph ghost" title="Clear In/Out points and selection" aria-label="Clear In/Out marks" data-i18n-title="clearMarks" data-i18n-aria="clearMarks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14 4 9l5-5" />
              <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
            </svg>
          </button>
          <button id="btnClearDeletes" class="btn tiny glyph ghost" title="Remove all deletions" aria-label="Remove all deletions" data-i18n-title="clearDeletes" data-i18n-aria="clearDeletes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16" />
              <path d="M9 7V4.5h6V7" />
              <path d="M6.5 7l.9 13h9.2l.9-13" />
              <path d="M10 11v5M14 11v5" />
            </svg>
          </button>
          <div id="ioReadout" class="io-readout">In — · Out —</div>
        </div>
      </section>

      <section class="panel-timeline" id="panelTimelineWrap" title="Drag on the filmstrip to select, double-click to set In/Out">
        <div class="timeline-scroll" id="ptlScroll">
          <div class="timeline" id="ptlTimeline">
            <div class="tl-base">
              <div id="ptlRuler" class="tl-ruler"></div>
              <div id="ptlFilm" class="tl-film"></div>
              <div id="ptlDeletes" class="tl-deletes"></div>
              <div id="ptlSubs" class="tl-subs"></div>
            </div>
            <div class="tl-overlay">
              <div id="ptlSelection" class="tl-selection hidden"></div>
              <div id="ptlMarkerIn" class="tl-marker in hidden" title="In point"></div>
              <div id="ptlMarkerOut" class="tl-marker out hidden" title="Out point"></div>
              <div id="ptlPlayhead" class="tl-playhead"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="util.js"></script>
    <script src="srt.js"></script>
    <script src="i18n.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
